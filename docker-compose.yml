services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: oficina
      POSTGRES_USER: oficina
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oficina -d oficina"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      ConnectionStrings__Oficina: Host=db;Port=5432;Database=oficina;Username=oficina;Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY:?defina JWT_KEY no .env}
      Jwt__Issuer: ${JWT_ISSUER:-oficina-api}
      Jwt__Audience: ${JWT_AUDIENCE:-oficina-clientes}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
